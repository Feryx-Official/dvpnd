# SPDX-License-Identifier: Apache-2.0
name: CI

# A release tag too: the release workflow publishes only a commit CI passed.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# A newer push to a pull request cancels the run it supersedes. Every other
# run is a group of its own, so a run on main or a release tag is never
# cancelled or held back, even as pending: the release gate reads it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # make build derives the version from git describe
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      # The regression gate every change passes (test/README.md).
      - run: make check
      # Each canary breaks one rule on purpose; its test must fail.
      - run: make check-canaries
      - run: make build
      - run: ./bin/dvpnd --help | head -3

  integration:
    name: Integration suite
    # Every job names its runner image, so a new ubuntu-latest changes
    # nothing unannounced, and all run on 24.04 because this one cannot move:
    # Ubuntu 26.04 ships an AppArmor profile for /usr/bin/wg-quick that
    # attaches to the privileged tunnels container and only lets it run
    # coreutils' readlink, while the Alpine image's is BusyBox, so wg-quick
    # exits 126 there.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Every protocol with its real daemon and a real client, in containers
      # (test/README.md). The WireGuard server uses the kernel module.
      - run: sudo modprobe wireguard
      - run: make check-integration

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Builds the same image operators run (docs/operator.md, section 7), so a
      # base-image or toolchain bump is checked before it is merged.
      - run: docker build --file Dockerfile --tag dvpnd:ci .
      - name: Smoke test the image
        run: |
          docker run --rm dvpnd:ci process --help | head -3
          docker run --rm dvpnd:ci sh -c 'wg --version && awg --version && v2ray version | head -1 && xray version | head -1 && hysteria version | head -3 && openvpn --version | head -1 && hnsd -v && iptables -V'

  licences:
    name: Licence gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The fork's legal position depends on never importing code without an
      # open-source licence. sentinel-go-sdk ships no licence file at all.
      - name: Refuse unlicensed Sentinel SDK
        run: |
          if grep -q 'sentinel-official/sentinel-go-sdk' go.mod go.sum; then
            echo '::error::github.com/sentinel-official/sentinel-go-sdk carries no licence and must not be a dependency'
            exit 1
          fi
      - name: Pinned sentinelhub is still Apache-2.0
        run: |
          go mod download github.com/sentinel-official/sentinelhub/v12
          mod=$(go list -m -f '{{.Dir}}' github.com/sentinel-official/sentinelhub/v12)
          [ -n "$mod" ] && [ -f "$mod/LICENSE" ] || { echo "::error::sentinelhub module directory not found ($mod)"; exit 1; }
          head -2 "$mod/LICENSE" | grep -q 'Apache License' || { echo '::error::sentinelhub LICENSE is no longer Apache-2.0'; exit 1; }
      - name: go-licenses
        run: |
          go run github.com/google/go-licenses@v1.6.0 check ./... \
            --ignore github.com/Feryx-Official/dvpnd/v9 \
            --disallowed_types=forbidden,restricted,unknown
      - name: SPDX headers present
        run: |
          missing=$(git ls-files -z '*.go' | xargs -0 -r grep -L 'SPDX-License-Identifier: Apache-2.0' || true)
          [ -z "$missing" ] || { echo "::error::missing SPDX header:"; echo "$missing"; exit 1; }

  provenance:
    name: Fork provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: bash docs/provenance/verify-fork.sh

  vulnerabilities:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Fails on a vulnerability the code reaches unless SECURITY.md explains
      # why it is accepted (Known dependency advisories).
      - run: bash scripts/govulncheck.sh

  lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # gosec and the standard linters: any finding fails the run, unless it
      # is excused on its own line with the reason (.golangci.yml).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
