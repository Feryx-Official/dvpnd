name: Docker

on:
  release:
    types:
      - released

# One release at a time, so :latest ends on the last one published, and never
# cut short: a cancelled run could leave an image pushed and not signed.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # Nothing is built or published until the tag is one the installer would
  # build and CI, the integration suite included, passed on its commit
  # (scripts/release-gate.sh).
  gate:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # verify_tag reads the signed tag object itself, so fetch it as it is.
      - name: Fetch the release's tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Signed tag, CI passed
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-gate.sh "${TAG}"

  build:
    name: Build
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # id-token and attestations let the job sign the image keylessly and
    # publish its build provenance; both are tied to this workflow's identity.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # An image name must be lower case and the owner's name is not
      # (Feryx-Official), so cosign would refuse github.repository as it is.
      - name: Set the image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # An SBOM and BuildKit's provenance travel with the image.
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless: the signature is bound to this workflow run through Sigstore,
      # so no signing key exists to leak. docs/operator.md shows how to verify.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # The installer runs as root, so the release carries it signed: an operator
  # checks it with cosign before running it, with no clone and no git
  # (docs/operator.md, section 0).
  installer:
    name: Signed installer
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # contents: write adds the files to the release; id-token signs them
    # keylessly, bound to this workflow run, as the image is.
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the installer
        run: |
          cp scripts/install.sh install.sh
          cosign sign-blob --yes --bundle install.sh.sigstore.json install.sh

      - name: Attach it to the release
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" install.sh install.sh.sigstore.json --clobber --repo "${GITHUB_REPOSITORY}"
