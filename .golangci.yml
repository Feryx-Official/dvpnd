# golangci-lint v2, the version `make tools` installs. CI runs it on every push
# and pull request and fails on any finding: a finding is fixed, or excused on
# its own line with //nolint:<linter> and the reason.
version: "2"

run:
  timeout: 10m
  # Test code too: a deprecated call or a dead assignment is one there as well.
  tests: true

issues:
  # Every finding, not the first three of a kind.
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    # Security checks: command injection, file permissions, weak crypto,
    # unchecked integer conversions and the like.
    - gosec
    # Every //nolint names its linter and says why.
    - nolintlint
  settings:
    gosec:
      excludes:
        # Unhandled errors are errcheck's, which knows the calls whose error
        # carries nothing (std-error-handling below); G104 repeats it without.
        - G104
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks:
        # golangci-lint's default set, less QF1008: AmneziaWG holds the default
        # tier's WireGuard embedded and the 3.1 tier's beside it, and naming
        # the embedded field says which of the two a call reaches.
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1008
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Tests build their own fixtures, temporary files and subprocesses;
      # gosec's findings there are about the test, not the node.
      - path: _test\.go
        linters:
          - gosec
